replicaCount: 1

image:
  repository: ghcr.io/faisalmashuri/notes-api
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.optio.id
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-optio-tls
      hosts:
        - api.optio.id

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

# --- tambahan di bagian paling bawah: konfigurasi app ---
env:
  APP_ENV: production
  LOG_LEVEL: info
  DB_HOST: postgres.apps.svc.cluster.local
  DB_NAME: notes
secretName: notes-api-secret